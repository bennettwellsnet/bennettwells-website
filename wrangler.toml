# Cloudflare Workers + Static Assets (Workers Builds)
name = "bennettwells-website"
main = "worker.js"
compatibility_date = "2025-07-01"

# Serve the prepared site from dist/ (npm run build → prepare-dist.mjs)
[assets]
directory = "./dist"
binding = "ASSETS"
# Run this Worker before static assets for private tree paths
run_worker_first = [ "/family-tree", "/family-tree/*" ]

# Non-secret defaults (set FAMILY_TREE_PASSWORD as an encrypted secret in the dashboard)
# [vars]
# FAMILY_TREE_PASSWORD is intentionally NOT stored here
